# Local development services for Ilmora.
#   docker compose -f infra/docker-compose.yml up -d
# Then: cd apps/api && php artisan migrate --seed --seeder=DemoSeeder
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ilmora
      POSTGRES_USER: ilmora
      POSTGRES_PASSWORD: ilmora
    ports: ["127.0.0.1:5432:5432"]   # local only; never expose Postgres publicly
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmora -d ilmora"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

volumes:
  pg_data:
